# Voice Mode for kandev — dictate a prompt into any native composer.
#
# The plugin has two halves. The UI bundle owns capture, engine selection and
# the per-user preferences; the Go backend exists only to relay audio to
# OpenAI with the operator's key, so that key never reaches the browser.
id: "kandev-plugin-voice"
api_version: 1
version: "0.1.0"
display_name: "Voice Mode"
description: "Dictate prompts into any kandev composer. Speak with the browser's own recognizer, a private in-browser Whisper model, or the server-side OpenAI relay."
author: "kandev"
categories: ["tools"]
repo_url: "https://github.com/kdlbs/kandev-plugin-voice"

# v0.88.0 is the first released host with the fully wired composer capability
# slots, editable plugin keybindings, and authenticated, size-limited webhook
# enforcement. Installing this package on an older host is unsafe: it cannot
# deliver transcripts reliably and may expose the transcription relay.
# Keep the `v` prefix: v0.87.x compares raw version strings and would accept
# `0.88.0` because its own running version starts with `v`.
min_kandev_version: "v0.88.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# user_state backs the per-user Voice Mode preferences (engine, language,
# model size, auto-send) through host.storage. No events, no kandev data
# reads, no writes: dictation only ever touches the composer the user is
# already typing into.
capabilities:
  user_state: true

webhooks:
  - key: "transcribe"
    description: "Relays recorded audio to OpenAI transcription using the operator-configured key. Browser-only: never call this from outside kandev."
    method: "POST"
    # Not an external webhook — the only caller is this plugin's own UI, so it
    # requires a signed-in kandev user. Without this an anonymous caller could
    # spend the operator's OpenAI budget.
    access: "authenticated"
    # A minute of Opus is well under a megabyte, but MediaRecorder falls back
    # to uncompressed WAV on some browsers. 16 MiB is the host ceiling and
    # still below OpenAI's own 25 MB request limit.
    max_body_bytes: 16777216

ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]
  keybindings:
    - id: "toggle-dictation"
      # Same combo core Voice Mode used, so existing muscle memory survives
      # the extraction. Rebindable under Settings > Keyboard shortcuts.
      default: "mod+shift+m"
      description: "Start or stop dictation in the focused composer"
      # Dictating into the field you are typing in is the whole feature, so
      # this binding has to fire while the composer holds focus. kandev skips
      # editable targets for plugin keybindings unless they ask for this.
      allow_in_editor: true

config_schema:
  type: object
  properties:
    openai_api_key:
      type: string
      title: "OpenAI API key"
      description: "Enables the \"Server Whisper\" engine for everyone on this kandev install. Leave empty to offer only the two browser engines, which send no audio to your server. Billed to this key per minute of audio."
      secret: true
    openai_model:
      type: string
      title: "Transcription model"
      description: "OpenAI transcription model used by the Server Whisper engine. Empty uses whisper-1."
      default: "whisper-1"
    openai_base_url:
      type: string
      title: "OpenAI-compatible endpoint"
      description: "Full URL of an OpenAI-compatible transcription endpoint, for self-hosted Whisper or a proxy. Empty uses https://api.openai.com/v1/audio/transcriptions."
